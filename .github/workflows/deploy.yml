name: 部署 H5 到 GitHub Pages

# 触发时机：push 到 main/master 分支，或手动点击运行
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支的多次部署串行，避免竞争
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建 H5 产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 计算 Pages base 路径
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步 manifest 路由 base
        run: |
          node -e "
            const fs=require('fs');
            const p='src/manifest.json';
            let s=fs.readFileSync(p,'utf8');
            const base='${{ steps.base.outputs.value }}';
            s=s.replace(/(\"base\"\\s*:\\s*)\"\\/[^\"]*\"/, '\$1\"'+base+'\"');
            fs.writeFileSync(p,s);
            console.log('router base ->', base);
          "

      - name: 构建 H5（注入 base 路径）
        run: npm run build:h5
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/build/h5

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
